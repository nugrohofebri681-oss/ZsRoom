name: CI

on:
  push:
    branches: ['reboot/foundation', 'claude/**']
  pull_request:
    branches: ['reboot/foundation']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Privacy · manifest · types · unit · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run validate:privacy
      - run: npm run validate:manifest
      - run: npm run validate:art
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run gallery
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-gallery-and-e2e
          path: |
            review-gallery/
            playwright-report/
            docs/reviews/foundation/
          retention-days: 14
