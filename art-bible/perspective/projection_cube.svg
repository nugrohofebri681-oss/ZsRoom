<svg xmlns="http://www.w3.org/2000/svg" width="520" height="420" viewBox="0 0 520 420" font-family="Helvetica, Arial, sans-serif"><rect width="520" height="420" fill="#fbf6f2"/>
    <rect x="60" y="20" width="200" height="140" fill="#e8c9cf" stroke="#3a2530" stroke-width="2"/>
    <rect x="60" y="160" width="200" height="200" fill="#c0607e" stroke="#3a2530" stroke-width="2"/>
    <text x="160" y="94" text-anchor="middle" font-size="12">TOP 100×100cm → 200×140px</text>
    <text x="160" y="260" text-anchor="middle" font-size="12" fill="#fff">FRONT 100×100cm → 200×200px</text>
    <text x="280" y="34" font-size="12">ZsRoom top-down ¾ projection</text>
    <text x="280" y="54" font-size="11">• Orthographic oblique, NO vanishing points</text>
    <text x="280" y="72" font-size="11">• Verticals stay vertical; front faces square-on</text>
    <text x="280" y="90" font-size="11">• Floor depth drawn at ×0.7</text>
    <text x="280" y="108" font-size="11">• Heights drawn at ×1</text>
    <text x="280" y="126" font-size="11">• Side faces are NOT visible</text>
    <text x="280" y="144" font-size="11">• Master density 2px per cm</text>
    <text x="280" y="162" font-size="11">• Key light: upper-left</text></svg>