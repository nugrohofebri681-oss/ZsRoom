function intro(){startStory([['Zila','Sayangg.. kalau kita bisa jalan di Bali, aku mau pantainya dulu. Pagi-pagi, sebelum pasirnya panas hehe.'],['Febri','Okee. Aku bawa buku kecil. Tiap tempat kita tinggalin satu cap, biar nanti inget kita ngapain di sana.'],['Zila','Ihh lucu. Tapi jangan isinya aku semua yang nulis yaa. Kamu juga harus isi.'],['Febri','Deal. Sanur dulu, terus ke sawah di Ubud. Nanti yang milih tempat lihat senja kamu yaa.'],['Zila','Aku udah pilih. Uluwatu. Tapi kita jangan buru-buru.. aku mau nikmatin pantainya dulu 🤏🏻'],['Febri','Boleh. Di tas aku ada kamera sama satu barang yang belum kamu tebak.'],['Zila','Mmm.. bekal? Kamu tau kan aku bakal laper kalau abis main air wkwk.'],['Febri','Bekal juga ada. Tapi ini benang layangan. Nanti kamu yang pegang, aku yang lari kalau nyangkut.'],['Zila','Ihh kok udah siap banget 😭 yaudah ayo. Yang pertama liat perahu biru harus nunjukin ke yang satunya yaa.']],()=>{state.seen=true;save();go('sanur')})}

let watch=false,watchTime=0;

if(false){ctx.strokeStyle='#fff2d269';for(let i=0;i<6;i++){ctx.beginPath();let y=289+i*7+Math.sin(clock*.9+i)*2;ctx.moveTo(30+i*131,y);ctx.quadraticCurveTo(55+i*131,y+3,86+i*131,y);ctx.stroke()}}

function turn(p,dx,dy){if(dx||dy)p.dir=Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up'}
let followTrail=[],camX=null;function loop(t){let dt=Math.min(.045,(t-last)/1000||0);last=t;clock+=dt;sceneAge+=dt;frame+=dt*56;const oldP={x:P.x,y:P.y},oldF={x:F.x,y:F.y};P.moving=F.moving=false;if(!modal&&!shoot&&!watch){let dx=(+!!(keys.ArrowRight||keys.KeyD))-(+!!(keys.ArrowLeft||keys.KeyA)),dy=(+!!(keys.ArrowDown||keys.KeyS))-(+!!(keys.ArrowUp||keys.KeyW));if(dx||dy){target=arrival=null}else if(target){dx=target.x-P.x;dy=target.y-P.y;if(Math.hypot(dx,dy)<5){target=null;dx=dy=0;let f=arrival;arrival=null;f?.()}}let d=Math.hypot(dx,dy);if(d){P.x=Math.min(930,Math.max(30,P.x+dx/d*Math.min(dt*198,d)));P.y=Math.min(605,Math.max(405,P.y+dy/d*Math.min(dt*198,d)));turn(P,dx,dy);P.moving=true}if(P.moving){const prev=followTrail.at(-1);if(!prev||Math.hypot(P.x-prev.x,P.y-prev.y)>5)followTrail.push({x:P.x,y:P.y})}let length=0,lastPos=F;for(let n of followTrail){length+=Math.hypot(n.x-lastPos.x,n.y-lastPos.y);lastPos=n}if(length>58&&followTrail.length){const n=followTrail[0],dx=n.x-F.x,dy=n.y-F.y,d=Math.hypot(dx,dy),step=Math.min(dt*208,d);if(d<3)followTrail.shift();else{F.x+=dx/d*step;F.y+=dy/d*step;turn(F,dx,dy)}}}

if(watch&&!modal){P.dir=F.dir='up';F.x+=(Math.min(930,P.x+45)-F.x)*Math.min(1,dt*2);F.y+=(P.y-F.y)*Math.min(1,dt*2);watchTime+=dt;if(watchTime>=6){watch=false;panel('Cahaya terakhir','<p>Zila: Hehe.. ternyata yang ini aku lebih inget karena tadi ga sibuk nyari pose.</p>',[['Cap Uluwatu',()=>stamp('uluwatu')]])}}
if(matchMedia('(max-width:600px) and (orientation:portrait)').matches){let v=$('c').parentElement,w=v.clientHeight*1.5;const desired=Math.min(0,Math.max(v.clientWidth-w,v.clientWidth/2-P.x*w/960));camX=camX===null?desired:camX+(desired-camX)*(1-Math.exp(-dt*9));v.style.setProperty('--pan',camX+'px')}draw();let s=nearest(),near=Math.hypot(P.x-s.x,P.y-s.y)<84;$('act').disabled=!near||shoot||watch;$('act').textContent=near?s.n:'Interaksi';$('tip').textContent=watch?'Menikmati senja berdua..':shoot?'Senyum dulu yaa..':'Ketuk tanah untuk jalan · ketuk papan untuk mampir';requestAnimationFrame(loop)}
$('c').onpointerdown=e=>{if(modal||shoot||watch)return;let r=$('c').getBoundingClientRect(),x=(e.clientX-r.left)/r.width*960,y=(e.clientY-r.top)/r.height*640;let marker=spots().find(s=>Math.abs(x-s.x)<85&&Math.abs(y-(s.y-99))<19);if(marker){target={x:marker.x,y:marker.y};arrival=marker.fn}else if(y>390){target={x:Math.min(930,Math.max(30,x)),y:Math.min(605,Math.max(405,y))};arrival=null}};
$('act').onclick=()=>nearest().fn();$('route').onclick=()=>{if(!shoot&&!watch)route()};$('book').onclick=()=>{if(!shoot&&!watch)book()};$('back').onclick=()=>{if(!shoot){watch=false;leave()}};
const art={sanur:[['Kejar anginnya','Benangnya di kamu, gulungannya di aku.'],['Kerang kecil','Kamu nyender dulu.. sini aku lihat kerangnya.']],ubud:[['Satu langkah lagi','Pegang tanganku. Pelan-pelan, jembatannya kecil.'],['Teduh berdua','Topinya cuma satu. Yaudah, kita bagi teduhnya.']],uluwatu:[['Peluk di ujung senja','Anginnya kenceng, sini aku rangkul.'],['Cium di bawah kamboja','Satu foto sebelum matahari pulang.']]};
let album={};try{album=JSON.parse(localStorage.getItem('bali-foto-v2')||'{}')||{}}catch{}
function portrait(k,i){return 'assets/bali/'+k+'-'+(i+1)+'.webp'}
function camera(){if(shoot||watch)return;panel('Foto di '+maps[loc].name,'<p>Pilih momen yang mau kita simpan, sayangg.</p><div class="proofs">'+art[loc].map(([n],i)=>'<button type="button" data-pose="'+i+'"><img src="'+portrait(loc,i)+'" alt=""><b>'+n+'</b></button>').join('')+'</div>',[['Kembali',close]]);document.querySelectorAll('[data-pose]').forEach(b=>b.onclick=()=>capture(loc,+b.dataset.pose))}
async function capture(k,i){if(shoot)return;shoot=true;close();target=arrival=null;try{let im=img(portrait(k,i));await im.decode();const layer=document.createElement('div');layer.id='shootLayer';layer.innerHTML='<img alt="" src="'+im.src+'"><strong></strong>';document.body.append(layer);for(let n=3;n;n--){layer.querySelector('strong').textContent=n;await new Promise(r=>setTimeout(r,750))}layer.querySelector('strong').textContent='Cekrek!';layer.classList.add('klik');await new Promise(r=>setTimeout(r,330));album[k+'-'+i]=true;try{localStorage.setItem('bali-foto-v2',JSON.stringify(album))}catch{}showPhoto(k,i)}catch{panel('Foto belum terbaca','<p>Periksa folder assets/bali lalu coba lagi.</p>',[['Kembali',close]])}finally{document.getElementById('shootLayer')?.remove();shoot=false}}
function showPhoto(k,i){let [n,caption]=art[k][i];panel(n,'<img class="card" src="'+portrait(k,i)+'" alt="'+n+'"><p>'+caption+'</p>',[['Unduh kartu pos',async()=>{try{const im=img(portrait(k,i));await im.decode();let c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight+112;let x=c.getContext('2d');x.drawImage(im,0,0);x.fillStyle='#fff1db';x.fillRect(0,im.naturalHeight,c.width,112);x.fillStyle='#533848';x.font='26px Georgia';x.textAlign='center';x.fillText(maps[k].name+' · '+n,c.width/2,im.naturalHeight+37);x.font='16px system-ui';x.fillText(caption,c.width/2,im.naturalHeight+65);x.font='13px monospace';x.fillText(Object.keys(maps).map(k=>(state.marks[k]?'✿ ':'○ ')+maps[k].name).join('   ·   '),c.width/2,im.naturalHeight+91);let a=document.createElement('a');a.href=c.toDataURL();a.download='Zila-Febri-'+k+'-'+(i+1)+'.png';a.click()}catch{panel('Unduhan belum siap','<p>Coba buka kembali fotonya.</p>',[['Kembali',book]])}}],['Lihat buku',book],['Jalan lagi',close]])}
const oldBook=book;book=function(){oldBook();const el=document.createElement('div');el.className='proofs';for(const k of Object.keys(art))art[k].forEach(([n],i)=>{if(!album[k+'-'+i])return;const b=document.createElement('button');b.innerHTML='<img src="'+portrait(k,i)+'" alt=""><b>'+n+'</b>';b.onclick=()=>showPhoto(k,i);el.append(b)});if(el.childElementCount)$('body').append(el)};
$('cam').onclick=camera;addEventListener('keydown',e=>{if(modal||shoot||watch)return;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyW','KeyS','KeyE'].includes(e.code)){e.preventDefault();keys[e.code]=true;if(e.code==='KeyE'&&!e.repeat&&!$('act').disabled)nearest().fn()}});addEventListener('keyup',e=>delete keys[e.code]);addEventListener('blur',()=>{for(let k in keys)delete keys[k]});go(loc);if(!state.seen)intro();requestAnimationFrame(loop)
